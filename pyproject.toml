[project]
name = "gemma4-darija-dz"
version = "0.1.0"
description = "Gemma fine-tuning on Algerian Arabic (Darija-DZ)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "bert-score>=0.3.13",
    "bitsandbytes>=0.50.1",
    "comet>=3.1.0",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "fastapi[standard]>=0.141.1",
    "huggingface-hub>=1.5.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "peft>=0.20.0",
    "pyspellchecker>=0.9.0",
    "python-dotenv>=1.2.3",
    "sacrebleu>=2.6.0",
    "scikit-learn>=1.9.0",
    "setuptools<80.0.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.57.6",
    "trl>=0.11.4",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
