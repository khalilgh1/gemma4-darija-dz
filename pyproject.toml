[project]
name = "gemma4-darija-dz"
version = "0.1.0"
description = "Gemma fine-tuning on Algerian Arabic (Darija-DZ)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.1",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "huggingface-hub<1.0,>=0.34.0",
    "peft>=0.20.0",
    "sacrebleu>=2.6.0",
    "setuptools<80.0.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.57.6",
    "trl>=0.11.4",
    "unbabel-comet>=2.2.7",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
